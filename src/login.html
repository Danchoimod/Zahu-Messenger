<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Yahoo! Messenger Login</title>
    <link rel="stylesheet" href="styles/login.css">
    <link rel="stylesheet" href="styles/windows.css">
</head>

<body>
    <div class="login-window">
        <div class="retro-title-bar">
            <div class="title-left">
                <span class="title-logo">Zahu!</span> MESSENGER
            </div>
            <div class="window-controls">
                <div class="control-btn min-button"><i data-lucide="minus"></i></div>
                <div class="control-btn max-button"><i data-lucide="square"></i></div>
                <div class="control-btn close"><i data-lucide="x"></i></div>
            </div>
        </div>
        <div class="menu-bar">
            <div class="menu-item" id="messenger-menu">Messenger</div>
            <div class="menu-item" id="help-menu">Help</div>
        </div>

        <div class="login-content">
            <div class="logo-container">
                <div class="yahoo-logo">Y<span>!</span></div>
                <div class="face-icon"><i data-lucide="smile"
                        style="width: 60px; height: 60px; color: #ffcc00; stroke-width: 1.5;"></i></div>
            </div>

            <div class="login-form">
                <div class="form-group">
                    <label for="username">Zahu! ID:</label>
                    <input type="text" id="username" spellcheck="false" value="Mod2090">
                </div>
                <div class="form-group">
                    <label for="password">Password:</label>
                    <input type="password" id="password" value="********">
                </div>

                <div class="checkbox-group">
                    <label class="checkbox-item">
                        <input type="checkbox" checked> Remember my ID & password
                    </label>
                    <label class="checkbox-item">
                        <input type="checkbox" checked> Sign in automatically
                    </label>
                    <label class="checkbox-item">
                        <input type="checkbox"> Sign in as invisible to everyone
                    </label>
                </div>

                <div class="signin-btn-container">
                    <button id="login-btn" class="signin-btn">Sign In</button>
                </div>


                <div class="footer-links">
                    <a href="#">Get a new Yahoo! ID...</a>
                    <a href="#">Forgot your password?</a>
                </div>
            </div>
        </div>
    </div>

    <script src="https://unpkg.com/lucide@latest"></script>
    <script>
        // Initialize Lucide icons
        lucide.createIcons();

        // Window controls
        document.querySelector('.min-button').addEventListener('click', () => {
            window.api.minimizeWindow();
        });
        document.querySelector('.max-button').addEventListener('click', () => {
            window.api.toggleMaximizeWindow();
        });
        document.querySelector('.close').addEventListener('click', () => {
            window.api.closeWindow();
        });

        document.getElementById('help-menu').addEventListener('click', () => {
            window.api.openAbout();
        });

        document.getElementById('messenger-menu').addEventListener('click', () => {
            window.api.openPreferences();
        });

        document.getElementById('login-btn').addEventListener('click', () => {
            // Notify main process to resize window
            window.api.loginSuccess();
            // Redirect to index.html
            window.location.href = 'index.html';
        });
    </script>
</body>

</html>
