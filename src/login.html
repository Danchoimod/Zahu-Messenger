<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Yahoo! Messenger Login</title>
    <link rel="stylesheet" href="styles/login.css">
    <link rel="stylesheet" href="styles/windows.css">
</head>

<body>
    <div class="login-window">
        <div class="retro-title-bar">
            <div class="title-left">
                <span class="title-logo">Zahu!</span> MESSENGER
            </div>
            <div class="window-controls">
                <div class="control-btn min-button"><i data-lucide="minus"></i></div>
                <div class="control-btn max-button"><i data-lucide="square"></i></div>
                <div class="control-btn close"><i data-lucide="x"></i></div>
            </div>
        </div>
        <div class="menu-bar">
            <div class="menu-item" id="messenger-menu">Messenger</div>
            <div class="menu-item" id="help-menu">
                Help
                <div class="dropdown" id="help-dropdown">
                    <div class="dropdown-item">Messenger Help <span class="shortcut">F1</span></div>
                    <div class="dropdown-item">Set up Video and Voice</div>
                    <div class="dropdown-divider"></div>
                    <div class="dropdown-item">Report Abuse</div>
                    <div class="dropdown-divider"></div>
                    <div class="dropdown-item">Messenger Homepage</div>
                    <div class="dropdown-item">Check for Updates</div>
                    <div class="dropdown-item">Send Feedback...</div>
                    <div class="dropdown-divider"></div>
                    <div class="dropdown-item">Report a Problem to Yahoo!</div>
                    <div class="dropdown-item" style="color: #999;">Turn off Diagnostic Logs</div>
                    <div class="dropdown-divider"></div>
                    <div class="dropdown-item" id="menu-about">About Yahoo! Messenger</div>
                </div>
            </div>
        </div>

        <div class="login-content" id="login-form-content">
            <div class="logo-container">
                <div class="yahoo-logo">Z<span>!</span></div>
                <div class="face-icon"><i data-lucide="smile"
                        style="width: 60px; height: 60px; color: #ffcc00; stroke-width: 1.5;"></i></div>
            </div>

            <div class="login-form">
                <div class="form-group">
                    <label for="username">Zahu! ID:</label>
                    <input type="text" id="username" spellcheck="false" value="Mod2090">
                </div>
                <div class="form-group">
                    <label for="password">Password:</label>
                    <input type="password" id="password" value="********">
                </div>

                <div class="checkbox-group">
                    <label class="checkbox-item">
                        <input type="checkbox" checked> Remember my ID & password
                    </label>
                    <label class="checkbox-item">
                        <input type="checkbox" checked> Sign in automatically
                    </label>
                    <label class="checkbox-item">
                        <input type="checkbox"> Sign in as invisible to everyone
                    </label>
                </div>

                <div class="signin-btn-container">
                    <button id="login-btn" class="signin-btn">Sign In</button>
                </div>


                <div class="footer-links">
                    <a href="#">Get a new Zahu! ID...</a>
                    <a href="#">Forgot your password?</a>
                </div>
            </div>
        </div>

        <!-- Signing In Overlay -->
        <div class="signing-in-screen" id="signing-in-screen">
            <div class="logo-container">
                <div class="yahoo-logo">Z<span>!</span></div>
                <div class="face-icon">
                    <div
                        style="position: relative; width: 80px; height: 80px; background: #ffcc00; border-radius: 50%; border: 2px solid #000; display: flex; align-items: center; justify-content: center; overflow: hidden;">
                        <div
                            style="position: absolute; top: 25px; left: 20px; width: 8px; height: 8px; background: #003399; border-radius: 50%;">
                        </div>
                        <div
                            style="position: absolute; top: 25px; right: 20px; width: 8px; height: 8px; background: #003399; border-radius: 50%;">
                        </div>
                        <div
                            style="position: absolute; bottom: 10px; width: 45px; height: 30px; background: #cc0000; border-radius: 0 0 45px 45px; border: 2px solid #000;">
                        </div>
                    </div>
                </div>
            </div>
            <div class="signing-in-text">
                Signing in as<br>
                <span class="signing-in-username" id="display-username">mailvictorhani</span>
            </div>
            <div class="cancel-btn-container">
                <button class="signin-btn" id="cancel-btn"><u>C</u>ancel</button>
            </div>
        </div>
    </div>

    <script src="https://unpkg.com/lucide@latest"></script>
    <script>
        // Initialize Lucide icons
        lucide.createIcons();

        // Window controls
        document.querySelector('.min-button').addEventListener('click', () => {
            window.api.minimizeWindow();
        });
        document.querySelector('.max-button').addEventListener('click', () => {
            window.api.toggleMaximizeWindow();
        });
        document.querySelector('.close').addEventListener('click', () => {
            window.api.closeWindow();
        });

        document.getElementById('help-menu').addEventListener('click', (e) => {
            e.stopPropagation();
            const dropdown = document.getElementById('help-dropdown');
            dropdown.classList.toggle('show');
        });

        document.getElementById('menu-about').addEventListener('click', (e) => {
            e.stopPropagation();
            window.api.openAbout();
            document.getElementById('help-dropdown').classList.remove('show');
        });

        // Close dropdown when clicking outside
        window.addEventListener('click', () => {
            document.getElementById('help-dropdown').classList.remove('show');
        });

        document.getElementById('messenger-menu').addEventListener('click', () => {
            window.api.openPreferences();
        });

        document.getElementById('login-btn').addEventListener('click', () => {
            const username = document.getElementById('username').value;
            document.getElementById('display-username').textContent = username;

            // Show signing in screen
            document.getElementById('login-form-content').style.display = 'none';
            document.getElementById('signing-in-screen').classList.add('show');

            // Wait 1.5 seconds then redirect
            setTimeout(() => {
                // Notify main process to resize window
                window.api.loginSuccess();
                // Redirect to index.html
                window.location.href = 'index.html';
            }, 1500);
        });

        document.getElementById('cancel-btn').addEventListener('click', () => {
            document.getElementById('login-form-content').style.display = 'flex';
            document.getElementById('signing-in-screen').classList.remove('show');
        });
    </script>
</body>

</html>
