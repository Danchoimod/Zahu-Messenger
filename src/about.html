<!DOCTYPE html>
<html lang="vi">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>About Yahoo! Messenger</title>
    <style>
        :root {
            --mauve-bg: #BD7E9D;
            --deep-purple: #7B2E6A;
            --link-cyan: #00D2FF;
            --text-lavender: #D8A8D8;
            --close-red: #E81123;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background-color: var(--mauve-bg);
            height: 100vh;
            display: flex;
            flex-direction: column;
            padding: 2px;
            overflow: hidden;
            -webkit-app-region: drag;
        }

        .title-bar {
            height: 30px;
            display: flex;
            align-items: center;
            justify-content: center;
            position: relative;
            color: #4a0031;
            font-size: 15px;
            font-weight: 500;
        }

        .window-icon {
            position: absolute;
            left: 10px;
            top: 50%;
            transform: translateY(-50%);
            width: 18px;
            height: 18px;
            background: url('https://icons.iconarchive.com/icons/danleech/simple/128/yahoo-icon.png') no-repeat center center;
            background-size: contain;
            filter: hue-rotate(280deg);
        }

        .close-btn {
            position: absolute;
            right: 0;
            top: 0;
            width: 45px;
            height: 20px;
            /* Tăng chiều cao để cân đối hơn */
            background: #D15B5B;
            color: white;
            display: flex;
            justify-content: center;
            align-items: center;
            cursor: pointer;
            -webkit-app-region: no-drag;
            font-size: 12px;
            /* Đã loại bỏ clip-path để giữ hình chữ nhật nguyên bản */
        }

        .close-btn:hover {
            background: #e81123;
        }

        .main-content {
            flex: 1;
            background-color: var(--deep-purple);
            margin: 4px;
            border: 1px solid #4a0031;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 30px 20px;
            color: white;
            text-align: center;
        }

        .logo-section {
            margin-bottom: 25px;
        }

        .logo-text {
            font-family: serif;
            font-size: 36px;
            font-weight: bold;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .messenger-text {
            font-size: 20px;
            font-weight: bold;
            text-transform: uppercase;
            letter-spacing: 1px;
            font-family: 'Segoe UI', sans-serif;
        }

        .version-text {
            color: var(--text-lavender);
            font-size: 14px;
            margin-bottom: 25px;
        }

        .links {
            display: flex;
            flex-direction: column;
            gap: 12px;
            margin-bottom: 35px;
        }

        .links a {
            color: var(--link-cyan);
            text-decoration: none;
            font-size: 14px;
        }

        .links a:hover {
            text-decoration: underline;
        }

        .copyright-text {
            color: var(--text-lavender);
            font-size: 13px;
            line-height: 1.5;
            margin-bottom: auto;
        }

        .ok-btn-container {
            width: 100%;
            display: flex;
            justify-content: center;
            padding-bottom: 10px;
            -webkit-app-region: no-drag;
        }

        .ok-btn {
            background: linear-gradient(to bottom, #7b2e6a, #4a0031);
            border: 1.5px solid #bd7e9d;
            color: white;
            padding: 4px 35px;
            cursor: pointer;
            font-size: 14px;
            position: relative;
            outline: none;
        }

        .ok-btn::after {
            content: '';
            position: absolute;
            top: 1px;
            left: 1px;
            right: 1px;
            bottom: 1px;
            border: 1px dotted rgba(255, 255, 255, 0.6);
            pointer-events: none;
        }

        .ok-btn:active {
            filter: brightness(0.8);
        }
    </style>
</head>

<body>
    <div class="title-bar">
        <div class="window-icon"></div>
        <span>About Zahu! Messenger</span>
        <div class="close-btn" id="close-btn">✕</div>
    </div>

    <div class="main-content">
        <div class="logo-section">
            <span class="logo-text">Zahu! <span class="messenger-text">MESSENGER</span></span>
        </div>

        <div class="version-text">
            Zahu! Messenger (11.5.0.228-us)
        </div>

        <div class="links">
            <a href="#">Copyright Notices</a>
            <a href="#">Privacy Policy</a>
            <a href="#">Terms of Service</a>
        </div>

        <div class="copyright-text">
            © 2026 Zahu! Inc. All rights reserved. (Vietnam)
        </div>

        <div class="ok-btn-container">
            <button class="ok-btn" id="ok-btn">OK</button>
        </div>
    </div>

    <script>
        document.getElementById('close-btn').onclick = () => window.api.closeWindow();
        document.getElementById('ok-btn').onclick = () => window.api.closeWindow();
    </script>
</body>

</html>
